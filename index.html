<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>

<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <div>
            <h3>Income</h3>
            <p>₹<span id="totalIncome">0</span></p>
        </div>
        <div>
            <h3>Expenses</h3>
            <p>₹<span id="totalExpenses">0</span></p>
        </div>
        <div>
            <h3>Balance</h3>
            <p>₹<span id="totalBalance">0</span></p>
        </div>

        <p id="message"></p>
    </div>

    <form id="form">
        <label for="name">Name: </label>
        <input type="text" id="name" placeholder="Enter name" required><br><br>

        <label for="amount">Amount: </label>
        <input type="number" id="amount" placeholder="Amount" step="0.01" min="0" required><br><br>

        <select id="transactionType" required>
            <option value="">Select Transaction Type</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
        </select>
        <br><br>

        <select id="transactionCategory" required>
            <option value="">Select Transaction Category</option>
            <option value="salary">Salary</option>
            <option value="groceries">Groceries</option>
            <option value="utilities">Utilities</option>
        </select>
        <br><br>

        <button type="submit">Add Transaction</button>
    </form>

    <div>
        <h2>Transactions</h2>
        <div id="list"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
